# Runs the Work Organizer's tests whenever its code changes.
name: Organizer tests

on:
  push:
    paths: ["organizer/**", ".github/workflows/organizer-tests.yml"]
  pull_request:
    paths: ["organizer/**", ".github/workflows/organizer-tests.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        working-directory: organizer
        run: python -m unittest discover -s tests -v
